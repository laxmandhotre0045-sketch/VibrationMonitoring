# Only tests/ is collected.
#
# scripts/ holds standalone utilities, and one of them -- test_auth_phase1.py --
# is named test_*.py and runs its work at import time, hitting a live database
# and a live login. Collecting it meant `pytest` at the repo root executed it
# and then failed the entire run on a missing dependency, so no test anywhere
# could be run from the root. VIK-015 converts that script properly; this makes
# the suite runnable in the meantime.
[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._config
