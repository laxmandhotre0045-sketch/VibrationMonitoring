[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    db: needs a PostgreSQL database; skipped with an explanation when none is reachable

# Third-party deprecations only. Nothing here hides a warning raised by this
# codebase's own code, so a new one still shows up.
filterwarnings =
    # starlette's TestClient references an anyio alias that anyio deprecated.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # pydantic v1-style class Config, inside pydantic itself.
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    # datetime.utcnow() is deprecated in 3.12+. SQLAlchemy column defaults,
    # python-jose and this codebase all use it; the columns are naive DateTime,
    # so moving to aware datetimes is a repo-wide change and its own ticket.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
