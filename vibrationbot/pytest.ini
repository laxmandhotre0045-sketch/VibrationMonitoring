[pytest]
testpaths = tests
python_files = test_*.py

# Put the repo root on sys.path so `app` and `tests` resolve no matter which
# directory pytest is invoked from. Without it the suite only works via
# `python -m pytest` from the root, because tests/ is imported as a package
# (from tests.fake_llm import ...) with no __init__.py.
pythonpath = .

# "live" marks tests that hit a real API (OpenAI) or need the full corpus.
# They are excluded by default so the suite runs offline and free; opt in with:
#   pytest -m live
markers =
    live: requires network / a real API key
    slow: takes more than a few seconds

addopts = -m "not live" --strict-markers -q
