<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senvia 3D equipment library</title>
<link href="./vendor/barlow.css" rel="stylesheet">


<style>
:root{--bg:#D9DEE2;--bg2:#F3F5F6;--panel:#FFFFFF;--ink:#1E2A33;--muted:#5E6B75;--line:#CDD3D8;--sel:#1F6FB2;--ok:#2E9E5B;--warn:#D99A00;--bad:#D2382F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161B20;--bg2:#2C353D;--panel:#232B32;--ink:#E8EDF1;--muted:#9AA6B0;--line:#39444D;--sel:#5AA7E8;}}
:root[data-theme="dark"]{--bg:#161B20;--bg2:#2C353D;--panel:#232B32;--ink:#E8EDF1;--muted:#9AA6B0;--line:#39444D;--sel:#5AA7E8;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:600;font-size:1.3rem;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:500 .9rem Barlow,sans-serif;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
#stage{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 35%,var(--bg2),var(--bg) 72%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#markers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#rev{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:#C0392B;color:#fff;font:600 .85rem Barlow,sans-serif;padding:6px 12px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:5;max-width:90%;text-align:center}
#hint{position:absolute;left:12px;top:10px;font-size:.8rem;color:var(--muted);pointer-events:none}
#drive{position:absolute;right:12px;top:10px;font-size:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--ink)}
.pt{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid #fff;background:#1E2A33;color:#fff;font:600 .8rem Barlow,sans-serif;pointer-events:auto;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35);padding:0}
.pt[aria-pressed="true"]{background:var(--sel);outline:3px solid color-mix(in srgb,var(--sel) 40%,transparent)}
.pt.occ{opacity:.35}
#tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.8rem;white-space:nowrap;transform:translate(20px,-50%);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pt.ok{background:var(--ok)}.pt.warn{background:var(--warn)}.pt.bad{background:var(--bad)}
.pt:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;max-height:46vh;overflow-y:auto;flex:none}
.filter{display:flex;gap:8px;align-items:center}
select{font:500 .9rem Barlow,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.chips{min-height:38px;flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button,.act{font:500 .88rem Barlow,sans-serif;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 11px;border-radius:999px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chips button i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible,select:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#info{font-size:.92rem;line-height:1.45}
#info strong{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:1.05rem;display:block}
#info .m{color:var(--muted)}
#info .parts{margin-top:4px;color:var(--muted);font-size:.85rem}
#info.collapsed .parts,#info.collapsed .paint{display:none}
#q{font:500 .9rem Barlow,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;flex:1;min-width:0}
.reg{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:6px}
@media (max-width:560px){#panel{max-height:40vh}}
.paint{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:.84rem;color:var(--muted)}
.paint b{font-weight:500;color:var(--ink)}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.25)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.act[aria-pressed="true"]{border-color:var(--sel);color:var(--sel)}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;color:#fff;font-weight:600;font-size:.8rem;margin-top:4px}
[hidden]{display:none!important}
@media (max-width:560px){#hint{display:none}}
#panel>*{flex:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>3D equipment library</h1>
    <div class="seg" role="group" aria-label="Library"><button id="mEq" aria-pressed="true">Equipment</button><button id="mCo" aria-pressed="false">Components</button></div>
  </header>
  <div id="stage"><canvas id="c" aria-label="3D model view"></canvas><div id="markers"></div><div id="rev" hidden role="alert">Reverse rotation — not normal operation for this machine</div><div id="hint">Drag to rotate, pinch or scroll to zoom, right-drag or two fingers to pan</div><div id="drive" hidden></div><div id="tip" hidden></div></div>
  <div id="panel">
    <div class="filter"><select id="grp" aria-label="Filter"></select><input id="q" type="search" placeholder="Search" aria-label="Search models"></div>
    <div class="chips" role="group" aria-label="Models" id="chips"></div>
    <div id="info"></div>
    <div class="row">
      <button class="act" id="cond" aria-pressed="false">Show sample condition</button>
      <button class="act" id="spin" aria-pressed="false">Rotate shafts</button>
      <button class="act" id="xray" aria-pressed="false">See inside</button>
      <button class="act" id="flowb" aria-pressed="false">Show flow</button>
      <button class="act" id="sensb" aria-pressed="false">Sensors</button>
      <button class="act" id="dirb" aria-pressed="false">Rotation: CW from DE</button>
      <button class="act" id="arrb" aria-pressed="true">Hide arrows</button>
      <button class="act" id="guard" aria-pressed="false">Show guards</button>
      <button class="act" id="reset">Reset view</button>
      <button class="act" id="more" aria-pressed="false">Details</button>
      <button class="act" id="png" hidden>Save image</button>
      <button class="act" id="glb" hidden>Export 3D (GLB)</button>
      <span id="xst" class="m" role="status" style="font-size:.82rem;color:var(--muted);align-self:center"></span>
    </div>
  </div>
</div>

document.getElementById('cond').onclick=e=>{showCond=!showCond;e.currentTarget.setAttribute('aria-pressed',showCond);e.currentTarget.textContent=showCond?'Hide sample condition':'Show sample condition';paintCond();renderInfo();};
document.getElementById('spin').onclick=e=>{spin=!spin;e.currentTarget.setAttribute('aria-pressed',spin);e.currentTarget.textContent=spin?'Stop shafts':'Rotate shafts';};
document.getElementById('reset').onclick=resetView;
document.getElementById('guard').onclick=e=>{guards=!guards;e.currentTarget.setAttribute('aria-pressed',guards);e.currentTarget.textContent=guards?'Hide guards':'Show guards';if(obj)obj.traverse(o=>{if(o.userData.guard)o.visible=guards;});};

// ---------- controls ----------
const ptrs=new Map(); let pinch=0,mid=null; const tmp=new THREE.Vector3(),rgt=new THREE.Vector3(),upv=new THREE.Vector3();
function pan(dx,dy){const k=radius*0.0012;rgt.setFromMatrixColumn(camera.matrix,0);upv.setFromMatrixColumn(camera.matrix,1);target.addScaledVector(rgt,-dx*k).addScaledVector(upv,dy*k);}
function pdist(){const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
function pmid(){const a=[...ptrs.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});if(ptrs.size===2){pinch=pdist();mid=pmid();}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(ptrs.size===1){if(p.b===2||e.shiftKey)pan(dx,dy);else{theta-=dx*0.008;phi=Math.min(1.52,Math.max(0.12,phi-dy*0.008));}p.x=e.clientX;p.y=e.clientY;}
 else if(ptrs.size===2){p.x=e.clientX;p.y=e.clientY;const d=pdist(),m=pmid();if(pinch>0)radius=Math.min(60,Math.max(0.8,radius*pinch/d));if(mid)pan(m.x-mid.x,m.y-mid.y);pinch=d;mid=m;}});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,e=>{ptrs.delete(e.pointerId);pinch=0;mid=null;}));
canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.min(60,Math.max(0.8,radius*(1+e.deltaY*0.001)));},{passive:false});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const v=new THREE.Vector3(),wp=new THREE.Vector3(),tip=document.getElementById('tip');let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(spin&&obj)obj.traverse(o=>{if(o.userData.spin){const r=(o.userData.spinRate===undefined?1:o.userData.spinRate)*dt*4*rotDir;if(o.userData.spin==='y')o.rotation.y+=r;else o.rotation.x+=r;}if(o.userData.anim)o.userData.anim(dt);});
 if(showFlow&&obj)obj.traverse(o=>{if(o.userData.flowTick)o.userData.flowTick(dt);});
 camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);camera.updateMatrixWorld();
 renderer.render(scene,camera);const w=stage.clientWidth,h=stage.clientHeight;
 const chk=(frame++%10)===0; if(chk&&obj) obj.updateMatrixWorld(true);
 points.forEach((p,i)=>{p.o.getWorldPosition(wp);
  if(chk){const d=wp.distanceTo(camera.position);ray.set(camera.position,tmp.copy(wp).sub(camera.position).normalize());ray.far=Math.max(0,d-0.06);p.el.classList.toggle('occ',ray.intersectObjects(solids,false).length>0);}
  v.copy(wp).project(camera);const px=(v.x+1)/2*w,py=(1-v.y)/2*h;p.el.style.display=v.z<1?'':'none';p.el.style.left=px+'px';p.el.style.top=py+'px';
  if(i===sel){tip.hidden=v.z>=1;tip.style.left=px+'px';tip.style.top=py+'px';}});
 if(sel<0)tip.hidden=true;
 requestAnimationFrame(loop);}
resize(); setMode('eq'); requestAnimationFrame(loop);
window.__obj=()=>obj;window.__setView=(a,b,c,x,y,z)=>{theta=a;phi=b;radius=c;target.set(x,y,z);};window.__arrows=()=>arrowG?arrowG.children.length:0;window.__lib={EQ,CO,show,setMode:m=>setMode(m),get:()=>({points:points.length})};
})();
</script>
<script>
/* Senvia host bridge — appended by tools/build_web_library.py, see that file. */
(function(){
 const lib=window.__lib;
 if(!lib){console.error('[senvia-3d] window.__lib missing; bridge disabled');return;}
 const ORIGIN=window.location.origin;
 // The library starts in Equipment mode (its last statement is setMode('eq')),
 // so the bridge starts believing the same. Tracking it here means selecting a
 // machine does not rebuild the first model of the list on the way past.
 let mode='eq';

 const find=id=>lib.EQ.find(d=>d.id===id)||lib.CO.find(d=>d.id===id)||null;

 function post(type,detail){
  try{ if(window.parent!==window) window.parent.postMessage(Object.assign({source:'senvia-3d',type:type},detail||{}),ORIGIN); }catch(e){}
 }

 function describe(def){
  return def?{id:def.id,name:def.name,drive:def.drive||'',industry:def.ind||def.cat||''}:null;
 }

 function showById(id){
  const def=find(id);
  if(!def){post('error',{message:'unknown model: '+id});return false;}
  const want=lib.EQ.indexOf(def)>=0?'eq':'co';
  if(want!==mode){lib.setMode(want);mode=want;}
  lib.show(def);
  post('shown',Object.assign({points:lib.get().points},describe(def)));
  return true;
 }

 window.addEventListener('message',function(e){
  if(e.origin!==ORIGIN)return;
  const m=e.data;
  if(!m||m.target!=='senvia-3d')return;
  if(m.type==='show'&&m.id)showById(m.id);
  // The library's stylesheet already answers to data-theme; left alone it
  // follows the operating system, which is how a dark Senvia ends up framing a
  // white panel.
  else if(m.type==='theme'&&(m.theme==='dark'||m.theme==='light'))document.documentElement.setAttribute('data-theme',m.theme);
  else if(m.type==='mode'&&(m.mode==='eq'||m.mode==='co')){lib.setMode(m.mode);mode=m.mode;post('mode',{mode:m.mode});}
  else if(m.type==='list')post('list',{
    equipment:lib.EQ.map(describe),
    components:lib.CO.map(describe)
  });
 });

 // A measurement point is the one thing the host genuinely needs to hear
 // about: tapping MP_03 is how a point gets bound to a sensor. The library
 // renders each point as a .pt button inside #markers, and rebuilds them on
 // every show(), so listen on the container rather than the buttons.
 const markers=document.getElementById('markers');
 if(markers)markers.addEventListener('click',function(e){
  const b=e.target.closest('.pt');
  if(!b)return;
  post('pointClick',{number:Number(b.textContent),label:b.getAttribute('aria-label')||''});
 });

 // ?model=<library id> preselects a machine, which is how opening a pump in
 // Senvia lands on the pump instead of whatever sorts first.
 const wanted=new URLSearchParams(window.location.search).get('model');
 if(wanted&&!showById(wanted))post('ready',{fallback:true});
 else post('ready',{model:wanted||null});
})();
</script>
