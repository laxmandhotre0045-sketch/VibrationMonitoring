# SensoVibe frontend.
#
# Two server blocks serve the same content:
#
#   4173  plain HTTP  — the original port, kept so existing bookmarks, the
#                       Python collector and any running tooling do not break.
#   4443  HTTPS       — same site and same API, TLS-terminated here.
#
# Both proxy /api/ to the backend rather than sending the browser to
# http://localhost:8000 directly. That gives one origin for page and API, which
# means no CORS preflight, and — the reason this matters for TLS — no
# mixed-content blocking, since an HTTPS page may not call an HTTP API.
#
# The certificate is mounted from ./certs on the host, not baked into the image,
# so it can be replaced (or swapped for a real CA-issued one) without a rebuild.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vibration_backend {
    server backend:8000;
}

# Raw snapshots are megabytes of CSV, and the collector posts them whole.
client_max_body_size 64m;

server {
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://vibration_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # Feature extraction over a long capture can take a while; the default
        # 60s would cut it off mid-computation.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass       http://vibration_backend/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 4443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sensovibe.crt;
    ssl_certificate_key /etc/nginx/certs/sensovibe.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://vibration_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass       http://vibration_backend/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
